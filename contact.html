<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>צור קשר - גל עיני</title>
  <meta name="description" content="צור קשר עם גל עיני בענייני אתר הצפנים, עזרה, דיווח תקלה או הצעת שיפור.">
  <link rel="canonical" href="https://neriyado20-lab.github.io/contact.html">
  <meta property="og:site_name" content="גל עיני">
  <meta property="og:type" content="website">
  <meta property="og:title" content="צור קשר - גל עיני">
  <meta property="og:description" content="צור קשר עם גל עיני בענייני אתר הצפנים, עזרה, דיווח תקלה או הצעת שיפור.">
  <meta property="og:url" content="https://neriyado20-lab.github.io/contact.html">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="styles.css?v=129">
</head>
<body class="contact-page">
  <header class="topbar">
    <div class="brand-area">
      <a class="brand" href="index.html" aria-label="חזרה לשער">
        <span class="brand-mark" aria-hidden="true">גע</span>
        <div>
          <strong>גל עיני</strong>
          <span>צור קשר</span>
        </div>
      </a>
    </div>
    <span class="hebrew-date" data-hebrew-date aria-label="תאריך עברי"></span>
    <nav aria-label="ניווט">
      <a href="index.html">ראשי</a>
      <a href="web.html">עבודה באתר</a>
      <a href="examples.html">אוצר הצפנים</a>
      <a href="contact.html">צור קשר</a>
    </nav>
  </header>

  <main class="contact-shell">
    <section class="order-intro">
      <p class="eyebrow">פנייה מסודרת</p>
      <h1>צור קשר</h1>
      <p>
        אפשר לשלוח עזרה, תקלה או הצעה.
      </p>
      <p class="order-note">
        אין לשלוח פרטים רגישים שלא לצורך.
      </p>
    </section>

    <section class="contact-grid">
      <form id="contactForm" class="contact-form">
        <label>
          <span>שם</span>
          <input id="contactName" required autocomplete="name" placeholder="שם מלא או שם פרטי">
        </label>
        <label>
          <span>טלפון / מייל לחזרה</span>
          <input id="contactReturn" required autocomplete="tel" placeholder="טלפון או כתובת מייל">
        </label>
        <label>
          <span>נושא</span>
          <select id="contactTopic" required>
            <option value="עזרה באתר הצפנים">עזרה באתר הצפנים</option>
            <option value="דיווח תקלה">דיווח תקלה</option>
            <option value="הצעת שיפור">הצעת שיפור</option>
            <option value="אחר">אחר</option>
          </select>
        </label>
        <label>
          <span>תוכן הפנייה</span>
          <textarea id="contactMessage" rows="6" required placeholder="כתוב בקצרה"></textarea>
        </label>
        <label class="contact-consent">
          <input id="contactConsent" type="checkbox" required>
          <span>אני מאשר שליחה ושמירת גיבוי מקומי.</span>
        </label>
        <div class="order-actions">
          <button class="button primary" type="submit">שלח פנייה</button>
          <button id="copyContactButton" class="button secondary" type="button" disabled>העתק נוסח</button>
        </div>
        <p id="contactStatus" class="payment-status" aria-live="polite"></p>
      </form>

      <div class="contact-panel">
        <h2>נוסח לשליחה</h2>
        <textarea id="contactSummary" class="order-summary" rows="12" readonly></textarea>
      </div>
    </section>

    <section class="contact-panel">
      <h2>פניות מקומיות</h2>
      <div id="contactList" class="rides-list"></div>
    </section>
  </main>

  <footer>
    <span>גל עיני - צור קשר</span>
    <span id="siteActivity"></span>
  </footer>
  <script src="site-interactions-config.js?v=1"></script>
  <script src="supabase-public.js?v=2"></script>
  <script src="hebrew-date.js?v=2"></script>
  <script src="site-interactions.js?v=9"></script>
  <script src="contact.js?v=5"></script>
</body>
</html>
